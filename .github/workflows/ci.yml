name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # The suite, on the one PHP version the project is verified against.
  #
  # The vendored `coroutine/phpunit.phar` is PHPUnit 13, which itself
  # requires PHP >= 8.4 — so the suite runs on PHP 8.5 with the vendored
  # toolchain, exactly as it does locally. No version matrix: a matrix over
  # versions the project cannot verify locally would only produce noise.
  # ---------------------------------------------------------------------
  suite:
    name: PHP 8.5 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, mbstring, ctype, pdo_sqlite
          ini-values: error_reporting=E_ALL
          coverage: none

      - name: Run the test suite
        run: php coroutine/phpunit.phar

      - name: Porting scanner self-test
        run: php tools/porting_scan.php --self-test

  # ---------------------------------------------------------------------
  # Every example, on both platforms.
  # ---------------------------------------------------------------------
  examples:
    name: Examples on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, mbstring, ctype, pdo_sqlite
          coverage: none

      - name: Run every example
        if: runner.os == 'Linux'
        run: |
          for f in examples/*.php; do
            [ "$f" = "examples/ExampleHelper.php" ] && continue
            echo "--- $f"
            php "$f" || { echo "example failed: $f"; exit 1; }
          done

      - name: Run every example
        if: runner.os == 'Windows'
        run: |
          $failed = @()
          Get-ChildItem examples\*.php | Where-Object { $_.Name -ne 'ExampleHelper.php' } | ForEach-Object {
            Write-Host "--- $($_.FullName)"
            php $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) { Write-Error ("examples failed: " + ($failed -join ', ')); exit 1 }

  # ---------------------------------------------------------------------
  # The Python original is used as a READ-ONLY oracle by the differential
  # harness. The job clones it next to the checkout; the harness skips
  # itself when the tree is absent, so this job is what actually exercises
  # the differential scenarios.
  # ---------------------------------------------------------------------
  differential:
    name: Differential harness (Python original as oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, mbstring, ctype, pdo_sqlite
          coverage: none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone the Python original (read-only oracle)
        run: |
          git clone --depth 1 https://github.com/wxai-space/LightAgent.git "$RUNNER_TEMP/LightAgent-main"

      - name: Run the differential harness
        env:
          LIGHTAGENT_PYTHON_ORIGINAL: ${{ runner.temp }}/LightAgent-main/LightAgent
        run: php coroutine/phpunit.phar tests/Differential
